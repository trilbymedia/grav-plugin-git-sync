PLUGIN_GIT_SYNC:
  ADMIN_NEXT_NOTICE: '**Git Sync** tiene su propia página de administración con el formulario de configuración completo, el asistente de configuración y las acciones Sincronizar / Restablecer. Ábrela desde la entrada **Git Sync** de la barra lateral.'
  PLUGIN_STATUS: 'Estado del complemento'
  ENABLED: 'Habilitado'
  DISABLED: 'Desactivado'
  BASIC_TITLE: 'Configuración básica'
  SYNC_DIRECTION: 'Dirección de sincronización'
  SYNC_DIRECTION_PULL: 'Unidireccional (solo Pull)'
  SYNC_DIRECTION_BOTH: 'Bidireccional (Pull y Push)'
  FOLDERS: 'Carpetas a sincronizar'
  FOLDERS_DESCRIPTION: 'Eliminar carpetas después de haber sido sincronizadas puede provocar resultados no deseados.'
  AUTOMATIC_SYNC_TITLE: 'Configuración de la sincronización automática'
  SYNC_NOTICE: |
    ! Para mejorar la velocidad al guardar páginas puedes desactivar la sincronización automática. De este modo, los cambios realizados en una página no se enviarán al repositorio remoto cada vez que se guarde. Para sincronizar los cambios con el repositorio, pulsa el botón GitSync (<i class="fa fa-git"></i>) situado en la parte superior izquierda del Panel de Administración, o utiliza la opción de Programador que aparece a continuación para añadir el trabajo de sincronización de GitSync al Programador (<strong>se requiere Grav 1.6</strong>).
  SYNC_ON_SAVE: 'Sincronizar al guardar una página'
  SYNC_ON_SAVE_HELP: 'Sincronizar con el directorio remoto cuando se guarda una página desde el administrador'
  SYNC_ON_DELETE: 'Sincronizar al eliminar una página'
  SYNC_ON_DELETE_HELP: 'Sincronizar con el directorio remoto cuando se elimina una página desde el administrador'
  SYNC_ON_MEDIA: 'Sincronizar al cambiar archivos multimedia'
  SYNC_ON_MEDIA_HELP: 'Sincronizar inmediatamente con el directorio remoto cuando se sube o elimina un archivo multimedia desde el administrador (en lugar de sincronizar únicamente cuando se guarda la página)'
  SYNC_CRON_ENABLE: 'Añadir la sincronización al Programador'
  SYNC_CRON_ENABLE_HELP: 'Añadir el trabajo de GitSync al Programador para que pueda realizar automáticamente la sincronización a la hora indicada'
  SYNC_CRON_AT: 'Ejecutar la sincronización a las'
  SYNC_CRON_AT_HELP: 'Cuándo debe ejecutar el Programador el trabajo de sincronización automática de GitSync'
  REPOSITORY_TITLE: 'Configuración del repositorio Git'
  LOCAL_REPOSITORY: 'Ruta del repositorio local'
  GIT_REPOSITORY: 'Repositorio Git'
  GIT_REPOSITORY_PLACEHOLDER: 'https://github.com/user/repository.git'
  NO_USER: 'No se requiere usuario'
  NO_USER_DESCRIPTION: 'Con esta opción activada, el usuario puede dejarse en blanco y se ignorará en la autenticación. Es útil cuando solo se necesitan tokens de acceso con el formato `token@host` en lugar de `user:password@host` '
  GIT_USER: 'Usuario de Git'
  GIT_USER_PLACEHOLDER: 'Nombre de usuario, no correo electrónico'
  GIT_PASSWORD: 'Contraseña o token de Git'
  GIT_PASSWORD_PLACEHOLDER: 'Tu contraseña o token de Git'
  GIT_PASSWORD_DESCRIPTION: 'Introduce tu contraseña o token para cifrarlo y almacenarlo de forma segura y, a continuación, guarda la configuración. Por motivos de seguridad, no volverá a mostrarse aquí.'
  WEBHOOK: 'URL del Web Hook del repositorio'
  WEBHOOK_PLACEHOLDER: '/_git-sync'
  WEBHOOK_ENABLED: 'Secreto del Web Hook'
  WEBHOOK_ENABLED_DESCRIPTION: 'Con esta opción activada, solo las llamadas autorizadas al webhook podrán iniciar una sincronización (recomendado)'
  WEBHOOK_SECRET: 'Secreto del Web Hook del repositorio'
  WEBHOOK_SECRET_PLACEHOLDER: 'Tu secreto del Web Hook'
  WEBHOOK_SECRET_DESCRIPTION: 'Puedes utilizar esta cadena generada aleatoriamente o introducir tu propio secreto. <br /> **Bitbucket** todavía no admite secretos de Webhook.'
  ADVANCED_TITLE: 'Configuración avanzada de Git'
  BRANCH: 'Rama local'
  BRANCH_PLACEHOLDER: 'main'
  REMOTE_NAME: 'Nombre del remoto'
  REMOTE_NAME_PLACEHOLDER: 'origin'
  REMOTE_BRANCH: 'Rama remota'
  REMOTE_BRANCH_PLACEHOLDER: 'main'
  GIT_AUTHOR: 'Autor de los commits'
  GIT_AUTHOR_GITUSER: 'Usar el nombre de usuario de Git'
  GIT_AUTHOR_GITSYNC: 'Usar el nombre del committer de GitSync'
  GIT_AUTHOR_GRAVUSER: 'Usar el nombre de usuario de Grav'
  GIT_AUTHOR_GRAVFULL: 'Usar el nombre completo del usuario de Grav'
  GIT_MESSAGE: 'Mensaje del commit'
  GIT_MESSAGE_PLACEHOLDER: '(Grav GitSync) Automatic Commit'
  GIT_MESSAGE_HELP: 'Puedes utilizar {{pageTitle}} o {{pageRoute}} en tu mensaje como marcadores de posición para el título o la ruta de la página que se está guardando'
  GIT_NAME: 'Nombre del committer'
  GIT_NAME_PLACEHOLDER: 'GitSync'
  GIT_EMAIL: 'Correo electrónico del committer'
  GIT_EMAIL_PLACEHOLDER: 'git-sync@trilby.media'
  GIT_BINARY: 'Ruta del binario de Git'
  GIT_BINARY_HELP: 'Si el comando `git` predeterminado no funciona en tu máquina o quieres especificar una ruta personalizada, indícala aquí'
  GIT_BINARY_PLACEHOLDER: '/usr/bin/git'
  GIT_IGNORE: 'Git Ignore'
  GIT_IGNORE_HELP: 'Añade reglas personalizadas de git ignore para utilizarlas con GitSync. Una por línea'
  GIT_IGNORE_PLACEHOLDER: |
    node_modules
    /.idea
  PRIVATE_SSH_KEY: 'Clave SSH privada'
  PRIVATE_SSH_KEY_PLACEHOLDER: '~/.ssh/id_rsa'
  PRIVATE_SSH_KEY_DESCRIPTION: >
    Para poder realizar un sparse-checkout y enviar cambios, es necesario tener configurada una clave SSH para acceder al repositorio. Normalmente se encuentra en `~/.ssh` y debe estar configurada para el mismo usuario que ejecuta el servidor web. <br />
    <br />
    Indica la clave secreta (no la pública) y asegúrate también de que el archivo tenga permisos estrictos. (`-rw-------`). <br />
    <br />
    Ejemplo: `private_key: /home/www-data/.ssh/id_rsa`<br />
    <br />
    **IMPORTANTE**: Las claves SSH con contraseña no están __ADMITIDAS__. Para eliminar una contraseña, ejecuta el comando `ssh-keygen -p` y, cuando se solicite la nueva contraseña, déjala en blanco y pulsa Intro.
  LOGGING: 'Registrar comandos de Git'
  LOGGING_HELP: 'Registra los comandos de Git. Es útil para depurar y solucionar problemas relacionados con la ejecución de Git'
  ACTIONS_TITLE: 'Acciones'
  WIZARD: 'Asistente de configuración'
  WIZARD_HELP: 'Inicia el asistente de configuración de Git Sync'

