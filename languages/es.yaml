ICU:
  PLUGIN_GIT_SYNC:
    ADMIN_NEXT_NOTICE: '**Git Sync** tiene su propia página de administración con el formulario de configuración completo, el Asistente de configuración y las acciones de Sincronizar / Restablecer. Ábrela desde la entrada **Git Sync** de la barra lateral.'
