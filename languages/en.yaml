PLUGIN_GIT_SYNC:
  ADMIN_NEXT_NOTICE: '**Git Sync** has its own admin page with the full configuration form, the setup Wizard, and the Synchronize / Reset actions. Open it from the **Git Sync** entry in the sidebar.'
  PLUGIN_STATUS: 'Plugin Status'
  ENABLED: 'Enabled'
  DISABLED: 'Disabled'
  BASIC_TITLE: 'Basic Settings'
  SYNC_DIRECTION: 'Sync direction'
  SYNC_DIRECTION_PULL: 'One-way (Pull only)'
  SYNC_DIRECTION_BOTH: 'Both-ways (Pull and Push)'
  FOLDERS: 'Folders to Sync'
  FOLDERS_DESCRIPTION: 'Removing folders after they have been synced may cause undesired results.'
  AUTOMATIC_SYNC_TITLE: 'Automatic Synchronization Settings'
  SYNC_NOTICE: |
    ! To improve the speed of saving pages you can disable automatic sync. Then, changes to a page will not be sent to the remote repository on every save. To sync your changes to the repository tap the GitSync button (<i class="fa fa-git"></i>) in the top left of the Administration Panel, or use the below Scheduler option to add the GitSync Syncronization Job to the Scheduler (<strong>Grav 1.6 required</strong>).
  SYNC_ON_SAVE: 'Sync on Page Save'
  SYNC_ON_SAVE_HELP: 'Sync with the remote directory when a page is saved through the admin'
  SYNC_ON_DELETE: 'Sync on Page Delete'
  SYNC_ON_DELETE_HELP: 'Sync with the remote directory when a page is deleted through the admin'
  SYNC_ON_MEDIA: 'Sync on Media Changes'
  SYNC_ON_MEDIA_HELP: 'Sync with the remote directory when a media is uploaded or deleted through the admin immediately (instead of only syncing when the page is saved)'
  SYNC_CRON_ENABLE: 'Add Sync to Scheduler'
  SYNC_CRON_ENABLE_HELP: 'Add GitSync Job to the Scheduler so it can automatically perform synchronization at the given time'
  SYNC_CRON_AT: 'Run Sync at'
  SYNC_CRON_AT_HELP: 'When should the Scheduler run the automatic GitSync synchronization job'
  REPOSITORY_TITLE: 'Git Repository Settings'
  LOCAL_REPOSITORY: 'Local Repository Path'
  GIT_REPOSITORY: 'Git Repository'
  GIT_REPOSITORY_PLACEHOLDER: 'https://github.com/user/repository.git'
  NO_USER: 'User not required'
  NO_USER_DESCRIPTION: 'With this setting enabled, the user can be left blank and it will be ignored from the authentication. Useful when only needing access tokens `token@host` rather than `user:password@host` '
  GIT_USER: 'Git User'
  GIT_USER_PLACEHOLDER: 'Username, not email'
  GIT_PASSWORD: 'Git Password or Token'
  GIT_PASSWORD_PLACEHOLDER: 'Your Git Password or Token'
  GIT_PASSWORD_DESCRIPTION: 'Enter your password or token to encrypt and securely store it, then save the settings. It will not show up here for security reasons.'
  WEBHOOK: 'Repository Web Hook URL'
  WEBHOOK_PLACEHOLDER: '/_git-sync'
  WEBHOOK_ENABLED: 'Web Hook Secret'
  WEBHOOK_ENABLED_DESCRIPTION: 'With this setting enabled, only authorized webhook calls will be able to trigger a synchronization (recommended)'
  WEBHOOK_SECRET: 'Repository Web Hook Secret'
  WEBHOOK_SECRET_PLACEHOLDER: 'Your Web Hook Secret'
  WEBHOOK_SECRET_DESCRIPTION: 'You can either use this randomly generated string or enter your own secret. <br /> **Bitbucket** does not yet support Webhook Secrets.'
  ADVANCED_TITLE: 'Advanced Git Settings'
  BRANCH: 'Local Branch'
  BRANCH_PLACEHOLDER: 'main'
  REMOTE_NAME: 'Remote Name'
  REMOTE_NAME_PLACEHOLDER: 'origin'
  REMOTE_BRANCH: 'Remote Branch'
  REMOTE_BRANCH_PLACEHOLDER: 'main'
  GIT_AUTHOR: 'Commits Author'
  GIT_AUTHOR_GITUSER: 'Use Git User Name'
  GIT_AUTHOR_GITSYNC: 'Use GitSync Committer Name'
  GIT_AUTHOR_GRAVUSER: 'Use Grav User Name'
  GIT_AUTHOR_GRAVFULL: 'Use Grav User Full Name'
  GIT_MESSAGE: 'Commit message'
  GIT_MESSAGE_PLACEHOLDER: '(Grav GitSync) Automatic Commit'
  GIT_MESSAGE_HELP: 'You can use {{pageTitle}} or {{pageRoute}} in your message as placeholders for the title or route of the page being saved'
  GIT_NAME: 'Committer Name'
  GIT_NAME_PLACEHOLDER: 'GitSync'
  GIT_EMAIL: 'Committer Email'
  GIT_EMAIL_PLACEHOLDER: 'git-sync@trilby.media'
  GIT_BINARY: 'Git Binary Path'
  GIT_BINARY_HELP: 'If the default `git` command doesn''t work on your machine or if you want to specify a custom path, do it in here'
  GIT_BINARY_PLACEHOLDER: '/usr/bin/git'
  GIT_IGNORE: 'Git Ignore'
  GIT_IGNORE_HELP: 'Add custom git ignore rules to go along with GitSync. One per line'
  GIT_IGNORE_PLACEHOLDER: |
    node_modules
    /.idea
  PRIVATE_SSH_KEY: 'Private SSH Key'
  PRIVATE_SSH_KEY_PLACEHOLDER: '~/.ssh/id_rsa'
  PRIVATE_SSH_KEY_DESCRIPTION: >
    In order to be able to sparse-checkout and push changes, it is expected you have an ssh-key configured for accessing the repository. This is usually found under `~/.ssh` and it needs to be configured for the same user that runs the web-server. <br />
    <br />
    Point it to the secret (not the public) and make also sure you have strict permissions to the file. (`-rw-------`). <br />
    <br />
    Example: `private_key: /home/www-data/.ssh/id_rsa`<br />
    <br />
    **IMPORTANT**: SSH keys with passphrase are __NOT__ supported. To remove a passphrase, run the `ssh-keygen -p` command and when asked for the new passphrase leave blank and return.
  LOGGING: 'Log Git Commands'
  LOGGING_HELP: 'Logs git commands. Useful to debug and troubleshoot git execution'
  ACTIONS_TITLE: 'Actions'
  WIZARD: 'Configuration Wizard'
  WIZARD_HELP: 'Launch the Git Sync setup wizard'

