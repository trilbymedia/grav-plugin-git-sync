PLUGIN_GIT_SYNC:
  ADMIN_NEXT_NOTICE: '**Git Sync** has its own admin page with the full configuration form, the setup Wizard, and the Synchronize / Reset actions. Open it from the **Git Sync** entry in the sidebar.'
  BASIC_TITLE: 'Basic Settings'
  SYNC_DIRECTION: 'Sync direction'
  SYNC_DIRECTION_PULL: 'One-way (Pull only)'
  SYNC_DIRECTION_BOTH: 'Both-ways (Pull and Push)'
  FOLDERS: 'Folders to Sync'
  FOLDERS_DESCRIPTION: 'Removing folders after they have been synced may cause undesired results.'
  AUTOMATIC_SYNC_TITLE: 'Automatic Synchronization Settings'
  SYNC_NOTICE: |
    ! To improve the speed of saving pages you can disable automatic sync. Then, changes to a page will not be sent to the remote repository on every save. To sync your changes to the repository tap the GitSync button (<i class="fa fa-git"></i>) in the top left of the Administration Panel, or use the below Scheduler option to add the GitSync Syncronization Job to the Scheduler (<strong>Grav 1.6 required</strong>).
  SYNC_ON_SAVE: 'Sync on Page Save'
  SYNC_ON_SAVE_HELP: 'Sync with the remote directory when a page is saved through the admin'
  SYNC_ON_DELETE: 'Sync on Page Delete'
  SYNC_ON_DELETE_HELP: 'Sync with the remote directory when a page is deleted through the admin'
  SYNC_ON_MEDIA: 'Sync on Media Changes'
  SYNC_ON_MEDIA_HELP: 'Sync with the remote directory when a media is uploaded or deleted through the admin immediately (instead of only syncing when the page is saved)'
  SYNC_CRON_ENABLE: 'Add Sync to Scheduler'
  SYNC_CRON_ENABLE_HELP: 'Add GitSync Job to the Scheduler so it can automatically perform synchronization at the given time'
  SYNC_CRON_AT: 'Run Sync at'
  SYNC_CRON_AT_HELP: 'When should the Scheduler run the automatic GitSync synchronization job'
  REPOSITORY_TITLE: 'Git Repository Settings'
  LOCAL_REPOSITORY: 'Local Repository Path'
  GIT_REPOSITORY: 'Git Repository'
  GIT_REPOSITORY_PLACEHOLDER: 'https://github.com/user/repository.git'
  NO_USER: 'User not required'
  NO_USER_DESCRIPTION: 'With this setting enabled, the user can be left blank and it will be ignored from the authentication. Useful when only needing access tokens `token@host` rather than `user:password@host` '
  GIT_USER: 'Git User'
  GIT_USER_PLACEHOLDER: 'Username, not email'
  GIT_PASSWORD: 'Git Password or Token'
  GIT_PASSWORD_PLACEHOLDER: 'Your Git Password or Token'
  GIT_PASSWORD_DESCRIPTION: 'Enter your password or token to encrypt and securely store it, then save the settings. It will not show up here for security reasons.'
  PASSWORD_SECURELY_STORED: 'Your password is securely stored.'
  PASSWORD_STORED_NOT_ENCRYPTED: 'Your password is stored but not encrypted.'
  PASSWORD_UNENCRYPTED_HINT: 'Existing password is stored unencrypted — saving the form will encrypt it.'
  WEBHOOK: 'Repository Web Hook URL'
  WEBHOOK_PLACEHOLDER: '/_git-sync'
  WEBHOOK_ENABLED: 'Web Hook Secret'
  WEBHOOK_ENABLED_DESCRIPTION: 'With this setting enabled, only authorized webhook calls will be able to trigger a synchronization (recommended)'
  WEBHOOK_SECRET: 'Repository Web Hook Secret'
  WEBHOOK_SECRET_PLACEHOLDER: 'Your Web Hook Secret'
  WEBHOOK_SECRET_DESCRIPTION: 'You can either use this randomly generated string or enter your own secret. <br /> **Bitbucket** does not yet support Webhook Secrets.'
  ADVANCED_TITLE: 'Advanced Git Settings'
  BRANCH: 'Local Branch'
  BRANCH_PLACEHOLDER: 'main'
  REMOTE_NAME: 'Remote Name'
  REMOTE_NAME_PLACEHOLDER: 'origin'
  REMOTE_BRANCH: 'Remote Branch'
  REMOTE_BRANCH_PLACEHOLDER: 'main'
  GIT_AUTHOR: 'Commits Author'
  GIT_AUTHOR_GITUSER: 'Use Git User Name'
  GIT_AUTHOR_GITSYNC: 'Use GitSync Committer Name'
  GIT_AUTHOR_GRAVUSER: 'Use Grav User Name'
  GIT_AUTHOR_GRAVFULL: 'Use Grav User Full Name'
  GIT_MESSAGE: 'Commit message'
  GIT_MESSAGE_PLACEHOLDER: '(Grav GitSync) Automatic Commit'
  GIT_MESSAGE_HELP: 'You can use {{pageTitle}} or {{pageRoute}} in your message as placeholders for the title or route of the page being saved'
  GIT_NAME: 'Committer Name'
  GIT_NAME_PLACEHOLDER: 'GitSync'
  GIT_EMAIL: 'Committer Email'
  GIT_EMAIL_PLACEHOLDER: 'git-sync@trilby.media'
  GIT_BINARY: 'Git Binary Path'
  GIT_BINARY_HELP: 'If the default `git` command doesn''t work on your machine or if you want to specify a custom path, do it in here'
  GIT_BINARY_PLACEHOLDER: '/usr/bin/git'
  GIT_IGNORE: 'Git Ignore'
  GIT_IGNORE_HELP: 'Add custom git ignore rules to go along with GitSync. One per line'
  GIT_IGNORE_PLACEHOLDER: |
    node_modules
    /.idea
  PRIVATE_SSH_KEY: 'Private SSH Key'
  PRIVATE_SSH_KEY_PLACEHOLDER: '~/.ssh/id_rsa'
  PRIVATE_SSH_KEY_DESCRIPTION: >
    In order to be able to sparse-checkout and push changes, it is expected you have an ssh-key configured for accessing the repository. This is usually found under `~/.ssh` and it needs to be configured for the same user that runs the web-server. <br />
    <br />
    Point it to the secret (not the public) and make also sure you have strict permissions to the file. (`-rw-------`). <br />
    <br />
    Example: `private_key: /home/www-data/.ssh/id_rsa`<br />
    <br />
    **IMPORTANT**: SSH keys with passphrase are __NOT__ supported. To remove a passphrase, run the `ssh-keygen -p` command and when asked for the new passphrase leave blank and return.
  LOGGING: 'Log Git Commands'
  LOGGING_HELP: 'Logs git commands. Useful to debug and troubleshoot git execution'
  ACTIONS_TITLE: 'Actions'
  ACTION_WIZARD: 'Wizard'
  ACTION_SYNCHRONIZE: 'Synchronize'
  ACTION_SAVE: 'Save'
  ACTION_RESET_LOCAL_COPY: 'Reset Local Copy'
  MENUBAR_SYNC_LABEL: 'Synchronize Git Sync'
  PLUGIN_PAGE_TITLE: 'Git Sync'
  FLOATING_WIDGET_LABEL: 'Git Sync Wizard'
  RESET_TITLE: 'Git Sync - Reset Local Copy'
  RESET_P1: 'By proceeding with the reset, all your local changes, if any, will be reverted to the repository state.'
  RESET_P2: 'Are you sure you want to continue?'
  RESET_CONFIRM_MSG: 'Discard all local changes and re-pull from the remote? Any uncommitted edits will be lost.'
  WIZARD: 'Text Variable'
  WIZARD_HELP: 'Text to add to the top of a page'
  WIZARD_TITLE: 'Git Sync — Wizard'
  WIZARD_STEP: 'Step'
  WIZARD_STEP_OF: 'Step {current} of {total}'
  WIZARD_STEP_WELCOME: 'Welcome'
  WIZARD_STEP_HOSTING: 'Hosting Service'
  WIZARD_STEP_REPOSITORY: 'Repository'
  WIZARD_STEP_WEBHOOK: 'Webhook'
  WIZARD_STEP_FOLDERS: 'Folders'
  WIZARD_CLOSE: 'Close'
  WIZARD_CANCEL: 'Cancel'
  WIZARD_PREVIOUS: 'Previous'
  WIZARD_NEXT: 'Next'
  WIZARD_SAVING: 'Saving…'
  WIZARD_SAVE_FINISH: 'Save & Finish'
  WIZARD_LOADING: 'Loading wizard…'
  WIZARD_NO_GIT_P1: 'The **Git Sync** plugin requires the <i class="fa fa-fw fa-git"></i> `git` binary to be installed and reachable on the server''s PATH.'
  WIZARD_NO_GIT_P2: 'If <i class="fa fa-fw fa-git"></i> `git` is missing, ask your hosting provider to install it, or set a custom **Git Binary Path** on the settings form below the wizard.'
  WIZARD_STEP0_P1: 'This wizard walks you through setting up **Git Sync** and your <i class="fa fa-fw fa-git"></i> repository in four steps. When done, your site will keep itself in sync with the <i class="fa fa-fw fa-git"></i> repository.'
  WIZARD_STEP0_LI1: 'Pick the hosting service and enter your access credentials.'
  WIZARD_STEP0_LI2: 'Point Git Sync at the repository and verify the connection.'
  WIZARD_STEP0_LI3: 'Optionally configure a webhook so the remote can notify your site of changes.'
  WIZARD_STEP0_LI4: 'Choose which `user/` folders to keep in sync.'
  WIZARD_STEP0_P2: 'Press **Next** to continue.'
  WIZARD_STEP1_P1: 'Choose the <i class="fa fa-fw fa-git"></i> hosting service you''ll be using and enter your username and password (or an access token / app password).'
  WIZARD_CREATE_ACCOUNT: 'create account'
  WIZARD_ANY_SERVICE: 'any git service with webhooks'
  WIZARD_USER_LABEL: 'Git User'
  WIZARD_NO_USER_LABEL: 'No user (token-only auth)'
  WIZARD_USER_PLACEHOLDER_NO_USER: 'username not required'
  WIZARD_USER_PLACEHOLDER: 'Username, not email'
  WIZARD_PASSWORD_LABEL: 'Git Password or Token'
  WIZARD_PASSWORD_PLACEHOLDER_STORED: 'Leave blank to reuse stored password'
  WIZARD_PASSWORD_PLACEHOLDER: 'Password or access token'
  WIZARD_2FA_TITLE: 'Access Tokens and 2FA (Two-factor Authentication)'
  WIZARD_2FA_P1: 'If you have never used Access Tokens or don''t know what 2FA is, you most likely only need your **regular password** for the field above. You can then skip this step and press **Next** to continue.'
  WIZARD_2FA_P2: 'However be aware that some services such as GitHub, don''t accept your plain password any longer and require the use of Access Token. You should use the Access Token as you preferred method.'
  WIZARD_MORE_DETAILS: 'More Details'
  WIZARD_2FA_DETAILS_P1: 'With GitSync you have the option to use an Access Token instead of your password, however if you have **2FA (Two-factor authentication)** enabled for your git service, you can only use Access Tokens.'
  WIZARD_2FA_DETAILS_P2: 'Using a token is more secure than using your password, because you can limit what can be done using it and it can be revoked without worrying about changing the password. As we are just syncing, we only need to give it read-and-write access to repositories and webhooks.'
  WIZARD_GH_TOKENS_P: 'With [GitHub''s Personal Access Tokens](https://help.github.com/articles/creating-an-access-token-for-command-line-use/), select the following Scopes:'
  WIZARD_GH_SCOPE_1: 'Full control of private repositories'
  WIZARD_GH_SCOPE_2: 'Full control of repository hooks'
  WIZARD_BB_PASSWORDS_P: 'With [BitBucket''s App Passwords](https://confluence.atlassian.com/bitbucket/app-passwords-828781300.html), select the following Permissions:'
  WIZARD_BB_PERM_REPO: 'Repositories:'
  WIZARD_BB_PERM_READ: 'Read'
  WIZARD_BB_PERM_WRITE: 'Write'
  WIZARD_BB_PERM_WEBHOOKS: 'Webhooks'
  WIZARD_BB_PERM_READ_WRITE: 'Read and write'
  WIZARD_GL_TOKENS_P: 'For [GitLab''s Personal Access Tokens](https://docs.gitlab.com/ee/user/profile/personal_access_tokens.html) select the following Scopes:'
  WIZARD_GL_SCOPE_1: 'Access your API'
  WIZARD_OTHER_TOKENS_TITLE: 'Other Git Repositories'
  WIZARD_OTHER_TOKENS_P: 'Usually under your profile settings is where you can generate a new Access Token. You want to ensure that you have enough read/write access for the repository as well as `webhook` access'
  WIZARD_STEP2_P1: 'Paste the full **HTTPS** clone URL of your repository. Most hosts list it on the project page next to "Clone".'
  WIZARD_STEP2_P2: 'If you''re starting from scratch, create the repo on the host first and check "initialize with a README" — Git Sync needs an initial commit to clone from.'
  WIZARD_STEP2_INTRO: 'If you already have a repository set up and ready to use, you can skip this step. Otherwise, please follow these steps:'
  WIZARD_STEP2_LI1_TITLE: 'If you are creating a new repository (recommended), you must create an initial commit.'
  WIZARD_STEP2_LI1_1: 'The service providers often ask you to do this when you made it.'
  WIZARD_STEP2_LI1_2: 'Check the box that says Initialize repository with a README or .gitignore'
  WIZARD_STEP2_LI1_3: 'This is required for GitSync to work.'
  WIZARD_STEP2_LI2_TITLE: 'Once you have made your repository, copy the full HTTPS URL and paste it into the box below.'
  WIZARD_STEP2_LI2_1: 'Most services offer both SSH and HTTPS addresses, **HTTPS is the recommended method.**'
  WIZARD_GH_REPO_HELP: 'Follow the instructions on [GitHub Help](https://help.github.com/articles/creating-a-new-repository/) to create a new GitHub repository.'
  WIZARD_BB_REPO_HELP: 'Follow the instructions on [Atlassian Documentation](https://confluence.atlassian.com/bitbucket/create-a-git-repository-759857290.html) to create a new Bitbucket repository. Make sure you select **Git** as repository type.'
  WIZARD_GL_REPO_HELP: 'GitLab calls repositories "Projects". Follow the instructions on [GitLab Documentation](https://docs.gitlab.com/ce/gitlab-basics/create-project.html) to create a new GitLab repository.'
  WIZARD_BB_URL_NOTICE: 'When you copy the HTTPS URL from Bitbucket, it also adds `your-user@` at the beginning of the URL which is not needed and should be removed. The URL be something like `https://bitbucket.org/your-user/your-repository.git`'
  WIZARD_REPO_FOOTNOTE: 'GitSync will use the above repository to store the **user/** folder items selected in Step 4.'
  WIZARD_REPO_LABEL: 'Git Repository'
  WIZARD_BRANCH_LABEL: 'Branch (master / main)'
  WIZARD_TESTING: 'Testing…'
  WIZARD_VERIFY_BTN: 'Verify Authentication, Connection & Branch'
  WIZARD_STEP3_P1: 'A webhook lets the remote repository tell your site about pushes so changes show up immediately. Set the URL below in the repo''s webhook settings on your git host.'
  WIZARD_STEP3_INTRO: 'A Webhook synchronizes the site when a change happens in the repository, and is set up at the service provider. This is a special URL to your site, that you add to your repository''s settings. We''ve auto-generated one for you below, but you can change this to whatever you''d like.'
  WIZARD_STEP3_SECRET_P: 'You can also use a secret token if your service provider supports it:'
  WIZARD_STEP3_INSTRUCTIONS_INTRO: 'Follow the steps below to add the Webhook to your service provider.'
  WIZARD_GH_HOOK_STEP1: 'Head to the repository on GitHub and click on `Settings`'
  WIZARD_GH_HOOK_STEP2: 'Click on `Webhooks` in the left sidebar'
  WIZARD_GH_HOOK_STEP3: 'Click on the `Add webhook`-button on the right'
  WIZARD_GH_HOOK_STEP4: 'Fill out the form as follows'
  WIZARD_GH_HOOK_PAYLOAD: 'Payload URL'
  WIZARD_GH_HOOK_CONTENT_TYPE: 'Content type'
  WIZARD_GH_HOOK_SECRET: 'Secret'
  WIZARD_GH_HOOK_LEAVE_EMPTY: 'leave empty'
  WIZARD_GH_HOOK_EVENTS: 'Which events would you like to trigger this webhook?'
  WIZARD_GH_HOOK_PUSH_EVENT: 'Just the push event.'
  WIZARD_GH_HOOK_ACTIVE: 'Active'
  WIZARD_GH_HOOK_STEP5: 'Click the `Add webhook`-button'
  WIZARD_BB_HOOK_STEP1: 'Head to the repository on Bitbucket and click <code><i class="fa fa-cog"></i> Settings</code> in the sidebar (if the sidebar is collapsed, this is represented by just <i class="fa fa-cog"></i>)'
  WIZARD_BB_HOOK_STEP2: 'Click on `Webhooks` on the left sidebar of the page that just loaded'
  WIZARD_BB_HOOK_STEP3: 'Click on the `Add webhook`-button at the top'
  WIZARD_BB_HOOK_TITLE: 'Title'
  WIZARD_BB_HOOK_TITLE_EXAMPLE: 'any title you like, eg. GitSync'
  WIZARD_BB_HOOK_URL: 'URL'
  WIZARD_BB_HOOK_PUSH: 'Repository push'
  WIZARD_BB_HOOK_STEP5: 'Click the `Save`-button'
  WIZARD_GL_HOOK_STEP1: 'Head to the repository on GitLab and click <code><i class="fa fa-cog"></i> **Settings**</code> dropdown-button from the page sidebar'
  WIZARD_GL_HOOK_STEP2: 'Select `Integrations` (or `Webhooks` if < v8.16) from the list'
  WIZARD_GL_HOOK_SECRET_TOKEN: 'Secret Token'
  WIZARD_GL_HOOK_PUSH_EVENTS: 'Push events'
  WIZARD_OTHER_HOOK_TITLE: 'Other git systems (Generic)'
  WIZARD_OTHER_HOOK_STEP1: 'Locate the area where you add the webhook in the repository. This will likely be in the settings for the repository you are adding.'
  WIZARD_OTHER_HOOK_STEP2: 'Please note this is an advanced option and dependent on the choice of git solution in use.'
  WIZARD_WEBHOOK_PATH_LABEL: 'Webhook URL path'
  WIZARD_FULL_URL: 'Full URL:'
  WIZARD_WEBHOOK_SECRET_CHECK: 'Use a webhook secret (recommended; not supported by Bitbucket)'
  WIZARD_WEBHOOK_SECRET_LABEL: 'Webhook Secret'
  WIZARD_WEBHOOK_SECRET_PLACEHOLDER: 'random secret'
  WIZARD_STEP4_P1: 'Pick which `user/` folders to keep under git control. You can change this later from the settings form.'
  WIZARD_STEP4_INTRO: 'Select which **user/** folders you would like to independently synchronize (default: Pages).'
  WIZARD_DESC_ACCOUNTS: 'This folder contains all the user accounts of the site.'
  WIZARD_DESC_CONFIG: 'This folder contains all the site configurations.'
  WIZARD_DESC_DATA: 'This folder contains all the stored data from plugins.'
  WIZARD_DESC_PAGES: 'This folders contains all the pages of your site.'
  WIZARD_DESC_PLUGINS: 'This folders contains all the plugins installed in your site.'
  WIZARD_DESC_THEMES: 'This folders contains all the themes installed in your site.'
  WIZARD_SENSITIVE_WARN: 'Careful! This folder can contain sensitive data and synchronizing it will potentially expose the data publicly. Private repository recommended.'
  WIZARD_THEMES_ALERT: 'Note that changes happening in this folder can''t be detected automatically by GitSync, therefore a manual synchronization will be required.'
  WIZARD_SAVE_INSTRUCTION: 'Press **Save** to complete the setup.'
  WIZARD_FOLDER_PAGES_HINT: 'Page content for the site.'
  WIZARD_FOLDER_THEMES_HINT: 'Theme files. Manual sync usually required for themes.'
  WIZARD_FOLDER_PLUGINS_HINT: 'Plugin packages.'
  WIZARD_FOLDER_CONFIG_HINT: 'Site configuration. May contain sensitive data.'
  WIZARD_FOLDER_DATA_HINT: 'Plugin-stored data. May contain sensitive data.'
  WIZARD_FOLDER_WARN: '⚠ Use a private repo if syncing this folder.'

